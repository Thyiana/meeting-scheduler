<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>会议室预约 · Room Booking</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#1c1b18" />
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="guest.css" />
<script src="theme.js"></script>

<!-- FullCalendar 6 (国内 BootCDN，v6 起样式已内置，无需单独引入 css) -->
<script src="https://cdn.bootcdn.net/ajax/libs/fullcalendar/6.1.15/index.global.min.js"></script>
<!-- <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script> -->

<script src="i18n.js"></script>
</head>
<body class="guest-body">

<header class="guest-header">
  <div class="guest-header-row">
    <div class="guest-title" data-i18n="guest.title">会议室预约</div>
    <div class="header-btns">
      <button id="themeToggleBtn" class="lang-toggle" type="button" title="深色模式">🌙</button>
      <button id="langToggleBtn" class="lang-toggle" data-i18n-lang-label>EN</button>
    </div>
  </div>
  <div class="guest-range" id="guestRangeText">2026-09-28 — 2026-09-30</div>
  <div class="guest-tz" data-i18n="guest.tz">本会议室所有预约时间均以新加坡时间（SGT）为准</div>
</header>

<div class="announcement-banner" id="announcementBanner">
  <span class="icon">📣</span>
  <span id="announcementText"></span>
</div>
<div class="announcement-banner room-banner" id="roomAnnouncementBanner">
  <span class="icon">📌</span>
  <span id="roomAnnouncementText"></span>
</div>
<div class="guest-offline-badge" id="offlineBadge" data-i18n="guest.offlineBadge">离线模式 · 显示的是最近一次缓存的排期</div>

<nav class="guest-room-tabs" id="guestRoomTabs"></nav>
<div class="guest-current-room" id="guestCurrentRoom">
  <span class="label" data-i18n="guest.currentRoom">当前选择：</span>
  <span id="guestCurrentRoomName"></span>
</div>

<div class="guest-day-tabs" style="padding-bottom:0;">
  <label class="toggle-switch" style="margin-left:auto;">
    <input type="checkbox" id="fullDayToggleGuest" />
    <span data-i18n="admin.toolbar.fullDay">显示全天 (24H)</span>
  </label>
</div>
<nav class="guest-day-tabs" id="guestDayTabs"></nav>

<main class="guest-calendar-wrap">
  <div id="guestCalendar"></div>
</main>

<button id="guestAddBtn" class="guest-fab" type="button" data-i18n="guest.addBtn">+ 新建预约</button>

<!-- ============ Booking Modal ============ -->
<div class="modal-overlay" id="guestBookModalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h3 id="guestBookModalTitle" data-i18n="guest.bookTitleNew">新建预约</h3>
      <button class="modal-close" id="guestBookModalClose">&times;</button>
    </div>
    <div class="error-text" id="guestFormError"></div>
    <form class="modal-form" id="guestBookForm">
      <input type="hidden" id="guestMeetingId" />
      <div class="field">
        <label for="guestRoom" data-i18n="guest.room">会议室</label>
        <select id="guestRoom" required></select>
      </div>
      <div class="field">
        <label for="guestTopic" data-i18n="guest.topic">会议主题</label>
        <input type="text" id="guestTopic" required autocomplete="off" />
      </div>
      <div class="field">
        <label for="guestHost" data-i18n="guest.host">姓名 / 主持人</label>
        <input type="text" id="guestHost" required autocomplete="off" />
      </div>
      <!-- Dropdown pickers instead of a tap-and-drag time grid: far harder
           to mis-tap on a phone. Values are combined into hidden
           datetime-local-shaped strings that the rest of the app already
           knows how to read/validate. -->
      <div class="field">
        <label for="guestDate" data-i18n="guest.date">预约日期</label>
        <select id="guestDate" required></select>
      </div>
      <div class="guest-picker-row">
        <div class="field">
          <label for="guestStartTime" data-i18n="guest.startTime">开始时刻</label>
          <select id="guestStartTime" required></select>
        </div>
        <div class="field">
          <label for="guestEndTime" data-i18n="guest.endTime">结束时刻</label>
          <select id="guestEndTime" required></select>
        </div>
      </div>
      <div class="field">
        <label for="guestLink" data-i18n="guest.link">参会人员名单链接</label>
        <input type="url" id="guestLink" data-i18n-placeholder="guest.linkPlaceholder" placeholder="Excel / 文档 URL（选填）" autocomplete="off" />
      </div>
      <div class="field">
        <label for="guestContact" data-i18n="guest.contact">联系电话 / 备注</label>
        <input type="text" id="guestContact" data-i18n-placeholder="guest.contactPlaceholder" placeholder="例如：138xxxxxxxx（选填）" autocomplete="off" />
      </div>
      <div class="field">
        <label data-i18n="guest.color">卡片颜色</label>
        <div class="color-pick-row">
          <label class="room-swatch-label" data-i18n-title="guest.colorCustomTitle" title="点击自定义这场会议卡片的颜色">
            <input type="color" id="guestCardColor" class="room-color-input" />
            <span id="guestCardColorSwatch" class="room-swatch" style="height:22px;"></span>
          </label>
          <span id="guestCardColorText" class="legend-hint"></span>
          <button type="button" id="guestColorResetBtn" class="btn btn-secondary btn-sm" data-i18n="guest.colorReset">恢复会议室默认色</button>
        </div>
      </div>
    </form>
    <div class="modal-footer">
      <div></div>
      <div class="right">
        <button id="guestCancelBtn" class="btn btn-secondary btn-sm" data-i18n="common.cancel">取消</button>
        <button id="guestSaveBtn" class="btn btn-sm" data-i18n="guest.saveNew">提交预约</button>
      </div>
    </div>
  </div>
</div>

<!-- ============ View-only Modal ============ -->
<div class="modal-overlay" id="guestViewModalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h3 data-i18n="guest.viewTitle">预约详情</h3>
      <button class="modal-close" id="guestViewModalClose">&times;</button>
    </div>
    <div class="guest-view-body" id="guestViewBody"></div>
    <div class="guest-view-actions">
      <button type="button" id="guestExportIcsBtn" class="btn btn-secondary btn-sm" data-i18n="guest.exportIcs">导出到日历 (.ics)</button>
      <button type="button" id="guestExportGoogleBtn" class="btn btn-secondary btn-sm" data-i18n="guest.exportGoogle">添加到 Google Calendar</button>
    </div>
    <div class="modal-footer">
      <button id="guestViewDeleteBtn" class="btn btn-danger btn-sm" data-i18n="guest.deleteBtn">取消该预约</button>
      <div class="right">
        <button id="guestViewEditBtn" class="btn btn-secondary btn-sm" data-i18n="guest.editBtn">编辑</button>
        <button id="guestViewCloseBtn" class="btn btn-secondary btn-sm" data-i18n="common.close">关闭</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="guest.js"></script>
<script src="pwa.js"></script>
</body>
</html>
